plugins {
    id 'com.android.application'
}

def releaseBuildNumber = providers.gradleProperty('releaseBuildNumber')
        .orElse(providers.environmentVariable('RELEASE_BUILD_NUMBER'))
        // Keep GitHub Actions compatible until the repository is migrated.
        .orElse(providers.environmentVariable('GITHUB_RUN_NUMBER'))
        .orElse('0').get().toInteger()
def versionCodeValue = 20_000_000 + releaseBuildNumber
// Kept for compatibility with builds that still use GitHub Actions.
def updateRepository = providers.environmentVariable('GITHUB_REPOSITORY')
        .orElse('sbw-better/HuangguoPlayerAndroid').get()
def giteeUpdateRepository = providers.environmentVariable('GITEE_UPDATE_REPOSITORY')
        .orElse('sibingwei/huangguoplayer-update').get()
def releaseStoreFile = System.getenv('ANDROID_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')

android {
    namespace 'com.example.huangguoplayer'
    compileSdk 36

    defaultConfig {
        applicationId 'com.example.huangguoplayer'
        minSdk 24
        targetSdk 36
        // The release pipeline supplies an ever-increasing number for upgrade compatibility.
        versionCode versionCodeValue
        versionName "2.0.${releaseBuildNumber}"
        // Filled by GitHub Actions so release builds know where to check for updates.
        buildConfigField 'String', 'UPDATE_REPOSITORY', "\"${updateRepository}\""
        // Updates are mirrored locally to Gitee after each GitHub Release.
        buildConfigField 'String', 'GITEE_UPDATE_REPOSITORY', "\"${giteeUpdateRepository}\""
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        // Keep the release build available while lint reports the remaining legacy findings.
        // The GitHub Actions job still runs lintRelease and retains its report in the build output.
        abortOnError false
    }

    signingConfigs {
        release {
            // Values are supplied only in CI through GitHub Actions secrets; never commit a keystore or password.
            if (releaseStoreFile != null && !releaseStoreFile.trim().isEmpty()) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.media3:media3-exoplayer:1.11.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.11.0'
    implementation 'androidx.media3:media3-ui:1.11.0'
}
