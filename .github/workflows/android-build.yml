name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Validate release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for secret_name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              echo "::error title=Missing GitHub Actions secret::$secret_name is not configured."
              missing=1
            fi
          done
          exit "$missing"

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/huangguoplayer-release.jks"
          test -s "$RUNNER_TEMP/huangguoplayer-release.jks"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/huangguoplayer-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon clean lintRelease assembleRelease

      - name: Generate update metadata
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          APK_DIR=app/build/outputs/apk/release
          SHA256=$(sha256sum "$APK_DIR/app-release.apk" | awk '{print $1}')
          printf '%s  %s\n' "$SHA256" "app-release.apk" > "$APK_DIR/app-release.apk.sha256"
          printf '{"versionCode":%s,"versionName":"v2.0.%s","apkName":"app-release.apk","sha256":"%s"}\n' \
            "$((20000000 + RUN_NUMBER))" "$RUN_NUMBER" "$SHA256" > "$APK_DIR/update.json"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: HuangguoPlayer-release-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
            app/build/outputs/apk/release/update.json
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download signed APK
        uses: actions/download-artifact@v6
        with:
          name: HuangguoPlayer-release-apk
          path: release

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v2.0.${{ github.run_number }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION_CODE=$((20000000 + RUN_NUMBER))
          gh release create "$RELEASE_TAG" \
            release/app-release.apk \
            release/app-release.apk.sha256 \
            release/update.json \
            --title "HuangguoPlayer $RELEASE_TAG" \
            --notes "自动构建发布。 versionCode: $VERSION_CODE"
