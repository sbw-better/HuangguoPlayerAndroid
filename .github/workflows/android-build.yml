name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Validate release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for secret_name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              echo "::error title=Missing GitHub Actions secret::$secret_name is not configured."
              missing=1
            fi
          done
          exit "$missing"

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/huangguoplayer-release.jks"
          test -s "$RUNNER_TEMP/huangguoplayer-release.jks"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/huangguoplayer-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon clean lintRelease assembleRelease

      - name: Generate update metadata
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          APK_DIR=app/build/outputs/apk/release
          SHA256=$(sha256sum "$APK_DIR/app-release.apk" | awk '{print $1}')
          printf '%s  %s\n' "$SHA256" "app-release.apk" > "$APK_DIR/app-release.apk.sha256"
          printf '{"versionCode":%s,"versionName":"v2.0.%s","apkName":"app-release.apk","sha256":"%s"}\n' \
            "$((20000000 + RUN_NUMBER))" "$RUN_NUMBER" "$SHA256" > "$APK_DIR/update.json"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: HuangguoPlayer-release-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
            app/build/outputs/apk/release/update.json
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download signed APK
        uses: actions/download-artifact@v6
        with:
          name: HuangguoPlayer-release-apk
          path: release

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v2.0.${{ github.run_number }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION_CODE=$((20000000 + RUN_NUMBER))
          gh release create "$RELEASE_TAG" \
            release/app-release.apk \
            release/app-release.apk.sha256 \
            release/update.json \
            --title "HuangguoPlayer $RELEASE_TAG" \
            --notes "自动构建发布。 versionCode: $VERSION_CODE"

  gitee-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Download signed APK
        uses: actions/download-artifact@v6
        with:
          name: HuangguoPlayer-release-apk
          path: release

      - name: Check Gitee publishing configuration
        id: gitee-config
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -n "$GITEE_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GITEE_TOKEN is not configured; skipping Gitee publishing."
          fi

      # The user-created repository starts empty. Create its master branch once so
      # Gitee has a target commit for release tags; later runs leave it untouched.
      - name: Initialize Gitee update repository
        if: steps.gitee-config.outputs.enabled == 'true'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          git init gitee-bootstrap
          cd gitee-bootstrap
          git config user.name "HuangguoPlayer Release Bot"
          git config user.email "actions@github.com"
          git remote add origin "https://oauth2:${GITEE_TOKEN}@gitee.com/sibingwei/huangguoplayer-update.git"
          if git ls-remote --exit-code origin refs/heads/master; then
            exit 0
          fi
          printf '%s\n' '# HuangguoPlayer Update Channel' > README.md
          printf '%s\n' 'This repository is maintained automatically by GitHub Actions.' >> README.md
          git add README.md
          git commit -m "Initialize update channel"
          git branch -M master
          git push -u origin master

      - name: Publish Gitee release assets
        if: steps.gitee-config.outputs.enabled == 'true'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          TAG="v2.0.${RUN_NUMBER}"
          API="https://gitee.com/api/v5/repos/sibingwei/huangguoplayer-update/releases"
          # A re-run must reuse its already-created Release rather than failing
          # before it can retry an interrupted attachment upload.
          STATUS=$(curl --silent --show-error --output gitee-release.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GITEE_TOKEN}" \
            --get --data-urlencode "access_token=${GITEE_TOKEN}" "${API}/tags/${TAG}")
          if [ "$STATUS" = "200" ]; then
            RELEASE_ID=$(jq -er '.id' gitee-release.json)
          else
            RESPONSE=$(curl --fail-with-body --silent --show-error \
              --request POST "$API" \
              --header "Authorization: Bearer ${GITEE_TOKEN}" \
              --form "access_token=${GITEE_TOKEN}" \
              --form "tag_name=${TAG}" \
              --form "name=HuangguoPlayer ${TAG}" \
              --form "body=自动构建发布。 versionCode: $((20000000 + RUN_NUMBER))" \
              --form "target_commitish=master")
            RELEASE_ID=$(printf '%s' "$RESPONSE" | jq -er '.id')
          fi
          for file in app-release.apk app-release.apk.sha256 update.json; do
            # Gitee's multipart endpoint requires access_token in the form body;
            # an Authorization header alone can create a Release but may silently
            # omit its attachment on some API deployments.
            UPLOAD_RESPONSE=$(curl --fail-with-body --silent --show-error \
              --request POST "https://gitee.com/api/v5/repos/sibingwei/huangguoplayer-update/releases/${RELEASE_ID}/attach_files" \
              --header "Authorization: Bearer ${GITEE_TOKEN}" \
              --form "access_token=${GITEE_TOKEN}" \
              --form "owner=sibingwei" \
              --form "repo=huangguoplayer-update" \
              --form "release_id=${RELEASE_ID}" \
              --form "file=@release/${file}"
            )
            printf '%s' "$UPLOAD_RESPONSE" | jq -er '.browser_download_url' >/dev/null
          done
