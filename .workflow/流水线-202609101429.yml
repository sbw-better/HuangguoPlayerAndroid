version: "1.0"
name: android-release
displayName: Android自动构建发布
stages:
- name: 构建并发布
  displayName: 构建并发布
  strategy: naturally
  trigger: auto
  steps:
  - step: build@android
    name: build-apk
    displayName: 构建 APK
    jdkVersion: "17"
    gradleVersion: "9.3"
    buildToolsVersion: 36.1.0
    ndkVersion: 28.2.13676358
    commands:
    - |
      set -e
      chmod +x gradlew scripts/publish-gitee-release.sh
      for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD RELEASE_GITEE_TOKEN; do
        test -n "$(printenv "$name")" || { echo "Missing Gitee Go secret: $name" >&2; exit 1; }
      done
      export RELEASE_BUILD_NUMBER="$(date +%s)"
      export RELEASE_VERSION_NAME="2.0.30"
      printf "%s" "$ANDROID_KEYSTORE_BASE64" | base64 -d > huangguo-player.jks
      test -s huangguo-player.jks || { echo "Decoded keystore is empty" >&2; exit 1; }
      export ANDROID_KEYSTORE_PATH="$PWD/huangguo-player.jks"
      ./gradlew --no-daemon \
        -PreleaseBuildNumber="$RELEASE_BUILD_NUMBER" \
        -PreleaseVersionName="$RELEASE_VERSION_NAME" \
        -PreleaseStoreFile="$ANDROID_KEYSTORE_PATH" \
        -PreleaseStorePassword="$ANDROID_KEYSTORE_PASSWORD" \
        -PreleaseKeyAlias="$ANDROID_KEY_ALIAS" \
        -PreleaseKeyPassword="$ANDROID_KEY_PASSWORD" \
        clean lintRelease assembleRelease
      GITEE_TOKEN="$RELEASE_GITEE_TOKEN" \
        GITEE_UPDATE_REPOSITORY="$UPDATE_REPOSITORY" \
        ./scripts/publish-gitee-release.sh
    artifacts:
    - name: ANDROID_RELEASE
      path:
      - app/build/outputs/apk/release/app-release.apk
      - app/build/outputs/apk/release/app-release.apk.sha256
      - app/build/outputs/apk/release/update.json
    caches:
    - "~/.gradle/caches"
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
triggers:
  trigger: auto
  push:
    branches:
      prefix:
      - ""
      precise:
      - main
      include: []
notify: []
variables:
  UPDATE_REPOSITORY: sibingwei/huangguo-player-android
  global:
  - ANDROID_KEYSTORE_BASE64
  - ANDROID_KEYSTORE_PASSWORD
  - ANDROID_KEY_ALIAS
  - ANDROID_KEY_PASSWORD
  - RELEASE_GITEE_TOKEN
