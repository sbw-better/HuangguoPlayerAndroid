version: "1.0"
name: android-release
displayName: Android自动构建发布
stages:
- name: 构建并发布
  displayName: 构建并发布
  strategy: naturally
  trigger: auto
  steps:
  - step: build@android
    name: build-apk
    displayName: 构建 APK
    jdkVersion: "17"
    gradleVersion: "9.3"
    buildToolsVersion: 36.1.0
    ndkVersion: 28.2.13676358
    commands:
    - 'set -e; chmod +x gradlew; export RELEASE_BUILD_NUMBER="$(date +%s)"; printf "%s" "$ANDROID_KEYSTORE_BASE64" | base64 -d > huangguo-player.jks; ANDROID_KEYSTORE_PATH="$PWD/huangguo-player.jks" ./gradlew --no-daemon -PreleaseBuildNumber="$RELEASE_BUILD_NUMBER" clean lintRelease assembleRelease; apk_dir="app/build/outputs/apk/release"; sha256="$(sha256sum "$apk_dir/app-release.apk" | awk "{print \$1}")"; printf "%s  %s\n" "$sha256" "app-release.apk" > "$apk_dir/app-release.apk.sha256"; printf "{\"versionCode\":%s,\"versionName\":\"2.0.%s\",\"apkName\":\"app-release.apk\",\"sha256\":\"%s\"}\n" "$((20000000 + RELEASE_BUILD_NUMBER))" "$RELEASE_BUILD_NUMBER" "$sha256" > "$apk_dir/update.json"'
    artifacts:
    - name: ANDROID_RELEASE
      path:
      - app/build/outputs/apk/release
      type: .tar.gz
    caches:
    - "~/.gradle/caches"
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
- name: 发布发行版
  displayName: 发布发行版
  strategy: naturally
  trigger: auto
  steps:
  - step: release@gitee
    name: publish-gitee-release
    displayName: 发布 Gitee Release
    releaseName: HuangguoPlayer Android
    description: 由 Gitee Go 自动构建的 Android 安装包。
    tagName: v2.0-latest
    upstreamArtifact:
    - ANDROID_RELEASE
    assertFiles:
    - app/build/outputs/apk/release/app-release.apk
    - app/build/outputs/apk/release/app-release.apk.sha256
    - app/build/outputs/apk/release/update.json
    prerelease: false
    allowUpdate: true
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
triggers:
  trigger: auto
  push:
    branches:
      prefix:
      - ""
      precise:
      - main
      include: []
notify: []
variables:
  UPDATE_REPOSITORY: Sibingwei/HuangguoPlayerAndroid
